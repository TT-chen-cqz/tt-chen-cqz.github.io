<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>跳转中</title>
    <script>
        (function() {
            var newOrigin = "http://tt-chen.cc.cd/";
            var path = window.location.pathname;
            var search = window.location.search;
            var hash = window.location.hash;
            var redirectUrl = newOrigin + path + search + hash;
            window.location.href = redirectUrl;
        })();
    </script>
</head>
<body>
</body>
</html>
